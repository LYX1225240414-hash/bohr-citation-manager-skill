name: citation-manager
version: 1.3.0
entrypoint: ../SKILL.md
bundle_root: ..
description: >
  参考文献与引用管理 Skill 的资源清单。执行内核为 resources/scripts/ref_lint.py，
  负责正文编号与文后列表的一致性核验、重复条目检出与归并建议。

resources:
  - path: resources/scripts/ref_lint.py
    kind: executable
    runtime: python3
    entry: "python3 resources/scripts/ref_lint.py"
    subcommands: [check, merge, placement]
    requires: []          # 纯标准库
    supports:
      citation_styles: ["numbered [1]", "superscript", "latex \\cite{key}"]
      list_styles: ["[1] Author (2020) ...", "1. Author (2020) ...", "\\bibitem{key} ..."]
    inputs: ["单文件（正文 + References/参考文献 标题）", "或 --body + --refs 两个文件"]
    outputs: ["/app/work/ref_report.json", "/app/work/ref_report.md",
              "/app/work/merge_suggestions.json",
              "/app/work/placement_report.json", "/app/work/placement_report.md"]
    outputs_note: >
      ref_report.json 的 verification_hint 给出 citation_resolvability /
      numbering_consistency / reference_coverage / dedup_clean / metadata_accuracy 五项计数口径。

  - path: resources/checklist.md
    kind: doc
    purpose: 自检与计数清单

  - path: resources/field_dict.md
    kind: doc
    purpose: 字段字典、锚点格式、去重判据与编号规则

  - path: resources/citation_rules.md
    kind: doc
    purpose: GB/T 7714—2015 与 APA 常用字段映射、去重与核验示例

  - path: resources/output_example.json
    kind: sample
    purpose: 输出结构示意（占位，非任何真实稿件结果）

  - path: examples/README.md
    kind: doc
    purpose: 最小调用示例与完整步骤

runtime:
  python: ">=3.9"
  network: not_required
  notes: >
    脚本只做编号与文本一致性核对，不做 DOI 联网解析。
    duplicate_entry 与 merge 候选基于题名相似度，合并前必须人工确认
    （预印本/正式版、中英文题名、同名作者不同文献都是易错点）。

changelog:
  - "1.2.0: 重号改为只统计参考文献列表内部重复，正文多次引用同一编号仅记 repeated_citations 提示；--out 兼容目录或文件名。"
  - "1.3.0: 新增 placement 子命令，机械回查 citation_map 的论断/证据短引、ref_id、锚点与匹配依据；文档与脚本子命令保持一致。"
